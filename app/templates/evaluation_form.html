{% extends 'base.html' %}{% block title %}{{ 'Modifier l’évaluation' if eval else 'Nouvelle évaluation' }}{% endblock %}{% block content %}
<div class="mb-4"><a class="text-decoration-none" href="{{ url_for('grades') }}">← Retour aux évaluations</a><h1 class="h2 mt-3">{{ 'Modifier l’évaluation' if eval else 'Nouvelle évaluation' }}</h1></div>
<form method="post" class="card border-0 shadow-sm"><div class="card-body p-4"><div class="row g-3">
<div class="col-md-12"><label class="form-label">Titre de l’évaluation *</label><input class="form-control" name="title" value="{{ eval.title if eval else '' }}" placeholder="Ex. Contrôle de grammaire" required></div>
<div class="col-md-6"><label class="form-label">Matière *</label><select class="form-select" name="subject_id" required><option value="">Choisir une matière</option>{% for s in subjects %}<option value="{{ s.id }}" {% if eval and eval.subject_id == s.id %}selected{% endif %}>{{ s.name }} ({{ s.level }})</option>{% endfor %}</select></div>
<div class="col-md-6"><label class="form-label">Classe *</label><select class="form-select" name="class_id" required><option value="">Choisir une classe</option>{% for c in classes %}<option value="{{ c.id }}" {% if eval and eval.class_id == c.id %}selected{% endif %}>{{ c.name }} ({{ c.level }})</option>{% endfor %}</select></div>
<div class="col-md-6"><label class="form-label">Date de l’évaluation *</label><input class="form-control" type="date" name="evaluation_date" value="{{ eval.evaluation_date if eval else '' }}" required></div>
<div class="col-md-6"><label class="form-label">Note maximale (barème) *</label><input class="form-control" type="number" step="0.5" min="1" name="max_score" value="{{ eval.max_score if eval else 20 }}" required></div>
</div></div><div class="card-footer bg-white text-end"><a class="btn btn-light" href="{{ url_for('grades') }}">Annuler</a> <button class="btn btn-primary">Enregistrer</button></div></form>
{% endblock %}
