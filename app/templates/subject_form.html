{% extends 'base.html' %}{% block title %}{{ 'Modifier la matière' if subject else 'Nouvelle matière' }}{% endblock %}{% block content %}
<div class="mb-4"><a class="text-decoration-none" href="{{ url_for('subjects') }}">← Retour aux matières</a><h1 class="h2 mt-3">{{ 'Modifier la matière' if subject else 'Ajouter une matière' }}</h1></div>
<form method="post" class="card border-0 shadow-sm"><div class="card-body p-4"><div class="row g-3">
<div class="col-md-6"><label class="form-label">Nom de la matière *</label><input class="form-control" name="name" value="{{ subject.name if subject else '' }}" placeholder="Ex. Mathématiques" required></div>
<div class="col-md-6"><label class="form-label">Niveau *</label><input class="form-control" name="level" value="{{ subject.level if subject else '' }}" placeholder="Ex. CP, CE1" required></div>
<div class="col-md-6"><label class="form-label">Coefficient *</label><input class="form-control" type="number" min="0.1" step="0.1" name="coefficient" value="{{ subject.coefficient if subject else 1 }}" required></div>
<div class="col-md-6"><label class="form-label">Année scolaire *</label><input class="form-control" name="school_year" value="{{ subject.school_year if subject else '2026-2027' }}" required></div>
</div></div><div class="card-footer bg-white text-end"><a class="btn btn-light" href="{{ url_for('subjects') }}">Annuler</a> <button class="btn btn-primary">Enregistrer</button></div></form>
{% endblock %}
