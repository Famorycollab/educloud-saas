{% extends 'base.html' %}{% block title %}Pré-inscription{% endblock %}{% block content %}<div class="login-wrap"><section class="card border-0 shadow"><div class="card-body p-4"><h1 class="h3">Pré-inscription</h1><p class="text-secondary">Soumettez une demande à l'administration de l'école.</p><form method="post"><div class="row g-3"><div class="col-sm-6"><label class="form-label">Prénom de l'enfant *</label><input class="form-control" name="first_name" required></div><div class="col-sm-6"><label class="form-label">Nom de l'enfant *</label><input class="form-control" name="last_name" required></div><div class="col-sm-6"><label class="form-label">Date de naissance</label><input class="form-control" name="birth_date" type="date"></div><div class="col-sm-6"><label class="form-label">Parent / tuteur *</label><input class="form-control" name="parent_name" required></div><div class="col-sm-6"><label class="form-label">E-mail du parent</label><input class="form-control" name="parent_email" type="email"></div><div class="col-sm-6"><label class="form-label">Téléphone</label><input class="form-control" name="parent_phone"></div></div><button class="btn btn-primary mt-4">Envoyer la demande</button></form></div></section></div>{% endblock %}
