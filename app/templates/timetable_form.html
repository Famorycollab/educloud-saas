{% extends 'base.html' %}{% block title %}{{ 'Modifier le créneau' if slot else 'Nouveau créneau' }}{% endblock %}{% block content %}
<div class="mb-4"><a class="text-decoration-none" href="{{ url_for('timetable') }}">← Retour à l’emploi du temps</a><h1 class="h2 mt-3">{{ 'Modifier le créneau' if slot else 'Ajouter un créneau' }}</h1></div>
<form method="post" class="card border-0 shadow-sm"><div class="card-body p-4"><div class="row g-3">
<div class="col-md-6"><label class="form-label">Classe *</label><select class="form-select" name="class_id" required><option value="">Choisir une classe</option>{% for c in classes %}<option value="{{ c.id }}" {% if slot and slot.class_id == c.id %}selected{% endif %}>{{ c.name }} ({{ c.level }})</option>{% endfor %}</select></div>
<div class="col-md-6"><label class="form-label">Enseignant *</label><select class="form-select" name="teacher_id" required><option value="">Choisir un enseignant</option>{% for t in teachers %}<option value="{{ t.id }}" {% if slot and slot.teacher_id == t.id %}selected{% endif %}>{{ t.full_name or t.username }}</option>{% endfor %}</select></div>
<div class="col-md-6"><label class="form-label">Matière *</label><select class="form-select" name="subject_id" required><option value="">Choisir une matière</option>{% for s in subjects %}<option value="{{ s.id }}" {% if slot and slot.subject_id == s.id %}selected{% endif %}>{{ s.name }} ({{ s.level }})</option>{% endfor %}</select></div>
<div class="col-md-6"><label class="form-label">Salle</label><select class="form-select" name="room_id"><option value="">Aucune salle attribuée</option>{% for r in rooms %}<option value="{{ r.id }}" {% if slot and slot.room_id == r.id %}selected{% endif %}>{{ r.name }} (Capacité: {{ r.capacity }})</option>{% endfor %}</select></div>
<div class="col-md-3"><label class="form-label">Jour de la semaine *</label><select class="form-select" name="weekday" required>{% for n,d in [(1,'Lundi'),(2,'Mardi'),(3,'Mercredi'),(4,'Jeudi'),(5,'Vendredi'),(6,'Samedi'),(7,'Dimanche')] %}<option value="{{ n }}" {% if slot and slot.weekday == n %}selected{% endif %}>{{ d }}</option>{% endfor %}</select></div>
<div class="col-md-3"><label class="form-label">Heure de début *</label><input class="form-control" type="time" name="start_time" value="{{ slot.start_time if slot else '' }}" required></div>
<div class="col-md-3"><label class="form-label">Heure de fin *</label><input class="form-control" type="time" name="end_time" value="{{ slot.end_time if slot else '' }}" required></div>
<div class="col-md-3"><label class="form-label">Année scolaire *</label><input class="form-control" name="school_year" value="{{ slot.school_year if slot else '2026-2027' }}" required></div>
</div></div><div class="card-footer bg-white text-end"><a class="btn btn-light" href="{{ url_for('timetable') }}">Annuler</a> <button class="btn btn-primary">Enregistrer</button></div></form>
{% endblock %}
