{% extends 'base.html' %}{% block title %}Mon profil{% endblock %}{% block content %}
<div class="mb-4"><h1 class="h2">Mon profil</h1><p class="text-secondary mb-0">Consultez vos informations personnelles et modifiez votre mot de passe.</p></div>
<div class="row g-4">
<div class="col-lg-6">
<div class="card border-0 shadow-sm h-100"><div class="card-body p-4">
<h2 class="h5 mb-3">Informations de compte</h2>
<form method="post" action="{{ url_for('profile_info') }}">
<div class="mb-3"><label class="form-label">Identifiant</label><input class="form-control bg-light" value="{{ user.username }}" readonly></div>
<div class="mb-3"><label class="form-label">Rôle</label><input class="form-control bg-light" value="{{ user.role|capitalize }}" readonly></div>
<div class="mb-3"><label class="form-label">Nom complet *</label><input class="form-control" name="full_name" value="{{ user.full_name or '' }}" required></div>
<div class="mb-3"><label class="form-label">Adresse e-mail</label><input class="form-control" name="email" type="email" value="{{ user.email or '' }}"></div>
<button class="btn btn-primary" type="submit">Mettre à jour mes informations</button>
</form>
</div></div>
</div>
<div class="col-lg-6">
<div class="card border-0 shadow-sm h-100"><div class="card-body p-4">
<h2 class="h5 mb-3">Sécurité & mot de passe</h2>
<form method="post" action="{{ url_for('profile_password') }}">
<div class="mb-3"><label class="form-label">Mot de passe actuel *</label><input class="form-control" name="current_password" type="password" required></div>
<div class="mb-3"><label class="form-label">Nouveau mot de passe (8 caractères minimum) *</label><input class="form-control" name="new_password" type="password" minlength="8" required></div>
<div class="mb-3"><label class="form-label">Confirmer le nouveau mot de passe *</label><input class="form-control" name="confirm_password" type="password" minlength="8" required></div>
<button class="btn btn-primary" type="submit">Changer mon mot de passe</button>
</form>
</div></div>
</div>
</div>
{% endblock %}
